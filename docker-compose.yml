services:
  web:
    build: .
    image: econverse-teste-front-end
    ports:
      - '${PORT:-8080}:80'
    restart: unless-stopped

  dev:
    image: node:24-alpine
    working_dir: /app
    command: sh -c 'npm ci && npm run dev -- --host 0.0.0.0'
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    profiles: ['dev']
